name: Chiffres SimGaze

on:
  schedule:
    - cron: "17 5 * * 1"   # chaque lundi vers 6 h, heure de Paris
  workflow_dispatch: {}      # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_simgaze.py
      - name: Enregistrer si les chiffres ont changé
        run: |
          git config user.name "kalyannmey-bot"
          git config user.email "actions@users.noreply.github.com"
          git add simgaze.json
          git diff --cached --quiet || git commit -m "Chiffres SimGaze du $(date -u +%F)"
          git push
